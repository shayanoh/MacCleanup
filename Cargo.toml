[package]
name = "maccleanup"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
description = "A colorful terminal app for macOS that shows where your disk space went and cleans it up safely"
license = "MIT"
readme = "README.md"
repository = "https://github.com/shayanoh/MacCleanup"
homepage = "https://github.com/shayanoh/MacCleanup"
keywords = ["macos", "disk-usage", "cleanup", "tui", "cache"]
categories = ["command-line-utilities", "filesystem"]
exclude = [".github/", "docs/", "scripts/", "CLAUDE.md", "makefile"]

[package.metadata.docs.rs]
# the code uses macOS system calls, so docs.rs must build for a Mac
targets = ["aarch64-apple-darwin"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
plist = "1.10.3"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"
